<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>울릉크루즈 제목 분석 보고서</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:rgb(55,53,47)}
body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple SD Gothic Neo","Noto Sans KR";font-size:16px;line-height:1.6}
*{box-sizing:border-box}
.page{max-width:900px;margin:0 auto;padding:64px}
h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;line-height:1.2}
h2{font-size:24px;font-weight:600;margin:2em 0 .6em;padding-bottom:4px;border-bottom:1px solid rgba(55,53,47,.09);line-height:1.3}
h3{font-size:18px;font-weight:600;margin:1.6em 0 .45em;line-height:1.35}
p{margin:.7em 0}
.muted{color:rgba(55,53,47,.65)}
.small{font-size:14px}
a{color:rgb(55,53,47);text-underline-offset:2px}
hr{border:0;border-top:1px solid rgba(55,53,47,.09);margin:28px 0}
.props{display:grid;grid-template-columns:88px 1fr;gap:6px 20px;margin:22px 0 28px;font-size:14px}
.prop-k{color:rgba(55,53,47,.65)}
.callout{background:rgb(241,241,239);border-radius:4px;padding:16px;margin:16px 0}
.callout.yellow{background:rgb(251,243,219)}
.callout.warn{background:rgb(253,236,238)}
.callout.red{background:rgb(251,228,228)}
.callout .label{font-size:14px;color:rgba(55,53,47,.65);margin-bottom:6px}
.callout p:first-of-type{margin-top:0}
.callout p:last-child{margin-bottom:0}
code,.tag{background:rgba(135,131,120,.15);border-radius:4px;padding:2px 6px;font-size:14px;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0 20px}
th{background:rgb(247,246,243);text-align:left;font-weight:600}
th,td{padding:10px 12px;border:1px solid rgba(55,53,47,.09);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.center,th.center{text-align:center}
.empty{color:rgba(55,53,47,.35)}
.quote{border-left:3px solid rgba(55,53,47,.2);padding:2px 0 2px 14px;margin:10px 0 14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 8px}
.card{background:#fff;border:1px solid rgba(55,53,47,.09);border-radius:8px;overflow:hidden}
.card img.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:rgb(247,246,243)}
.card .body{padding:12px 14px 16px}
.card h3{margin-top:0;font-size:16px}
.card .meta,.card .caption{font-size:14px;color:rgba(55,53,47,.65);margin:6px 0}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:12px 0 16px}
.slot{background:rgb(241,241,239);border-radius:4px;padding:10px 12px;font-size:14px}
.slot .k{color:rgba(55,53,47,.65);font-size:13px;display:block;margin-bottom:2px}
.rec{margin:2.2em 0 1.4em}
.rec-kicker{font-size:14px;color:rgba(55,53,47,.65);margin-bottom:4px}
.rec h2{border-bottom:none;padding-bottom:0;margin-top:0;font-size:26px;line-height:1.35}
ol.rules{padding-left:22px}
ol.rules li{margin:8px 0}
footer{margin-top:56px;padding-top:20px;border-top:1px solid rgba(55,53,47,.09);font-size:14px;color:rgba(55,53,47,.65)}
footer .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
@media (max-width:720px){
  .page{padding:32px 20px}
  .cards,.slots{grid-template-columns:1fr}
  h1{font-size:28px}
}
</style>
</head>
<body>
<article class="page">
<h1>울릉크루즈 제목 분석 보고서</h1>
<p class="muted small">예스준 · 제목 잠금 · 공개 숫자만 · 추정 조회 없음</p>

<div class="props">
  <div class="prop-k">상태</div><div>제목 잠금</div>
  <div class="prop-k">날짜</div><div>2026-08-21 KST</div>
  <div class="prop-k">채널</div><div>예스준</div>
  <div class="prop-k">작성</div><div>예스준 HQ</div>
  <div class="prop-k">범위</div><div>한국 출발 크루즈·페리 공개 숫자만</div>
  <div class="prop-k">Sources</div><div>content.md · reference.md · ulleung-cruise/videos.md</div>
</div>
